apiVersion: v1
kind: Namespace
metadata:
  name: flux-system

---
apiVersion: source.toolkit.fluxcd.io/v1beta1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/your-repo/your-flux-config
  ref:
    branch: main

---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: "./"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: flux-system

---
apiVersion: source.toolkit.fluxcd.io/v1beta1
kind: HelmRepository
metadata:
  name: flux-helm
  namespace: flux-system
spec:
  interval: 1m
  url: https://charts.fluxcd.io

---
apiVersion: helm.toolkit.fluxcd.io/v1beta1
kind: HelmRelease
metadata:
  name: flux
  namespace: flux-system
spec:
  releaseName: flux
  chart:
    spec:
      chart: flux
      sourceRef:
        kind: HelmRepository
        name: flux-helm
        namespace: flux-system
  values:
    git:
      url: https://github.com/your-repo/your-flux-config
      branch: main
      path: "./clusters/my-cluster"